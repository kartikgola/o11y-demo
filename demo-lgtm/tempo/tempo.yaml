server:
  http_listen_port: 3200

# OTLP receiver — the collector sends traces to this port
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

# Minimal in-memory-ish tracing pipeline for the demo
compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo-wal
    local:
      path: /tmp/tempo-blocks

usage_report:
  reporting_enabled: false
